<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Tamagotchi Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe6f2, #dff7ff);
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
    }

    .game-wrapper {
      width: 360px;
      max-width: 92vw;
      background: #fff8fd;
      border: 6px solid #ff8fc7;
      border-radius: 36px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(255, 105, 180, 0.25);
      text-align: center;
      position: relative;
    }

    .title {
      font-size: 26px;
      margin-bottom: 14px;
      color: #ff4fa3;
      letter-spacing: 1px;
    }

    .screen {
      background: #c9f7d5;
      border: 5px solid #3f7f5f;
      border-radius: 22px;
      padding: 18px 12px;
      min-height: 260px;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }

    .sky-decoration {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.65;
    }

    .cloud {
      position: absolute;
      background: white;
      border-radius: 999px;
      width: 58px;
      height: 18px;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 26px;
      height: 26px;
      left: 8px;
      top: -13px;
    }

    .cloud::after {
      width: 32px;
      height: 32px;
      right: 7px;
      top: -17px;
    }

    .cloud.one {
      top: 28px;
      left: 22px;
    }

    .cloud.two {
      top: 62px;
      right: 24px;
      transform: scale(0.8);
    }

    .pet-area {
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-top: 28px;
      position: relative;
      z-index: 2;
    }

    .pet {
      width: 104px;
      height: 104px;
      background: #fff36d;
      border: 4px solid #333;
      border-radius: 52% 48% 46% 54%;
      position: relative;
      animation: bounce 1.2s infinite ease-in-out;
      transition: 0.25s ease;
    }

    .pet.sick {
      background: #b9e8aa;
      animation: wobble 0.8s infinite;
    }

    .pet.sleeping {
      background: #d8c4ff;
      animation: sleepBob 2s infinite ease-in-out;
    }

    .pet.dead {
      background: #bdbdbd;
      animation: none;
      transform: rotate(8deg);
    }

    .ear {
      position: absolute;
      width: 26px;
      height: 34px;
      background: inherit;
      border: 4px solid #333;
      top: -18px;
      z-index: -1;
    }

    .ear.left {
      left: 15px;
      border-radius: 70% 30% 40% 60%;
      transform: rotate(-22deg);
    }

    .ear.right {
      right: 15px;
      border-radius: 30% 70% 60% 40%;
      transform: rotate(22deg);
    }

    .eye {
      position: absolute;
      width: 12px;
      height: 15px;
      background: #333;
      border-radius: 50%;
      top: 38px;
    }

    .eye.left { left: 28px; }
    .eye.right { right: 28px; }

    .pet.sleeping .eye,
    .pet.dead .eye {
      height: 4px;
      border-radius: 999px;
      top: 43px;
    }

    .mouth {
      position: absolute;
      width: 28px;
      height: 15px;
      border-bottom: 4px solid #333;
      border-radius: 0 0 50px 50px;
      left: 50%;
      transform: translateX(-50%);
      top: 60px;
    }

    .pet.sick .mouth {
      border-bottom: none;
      border-top: 4px solid #333;
      border-radius: 50px 50px 0 0;
      top: 68px;
    }

    .pet.dead .mouth {
      border-bottom: none;
      width: 24px;
      height: 4px;
      background: #333;
      top: 68px;
    }

    .status-text {
      position: relative;
      z-index: 2;
      min-height: 24px;
      margin: 10px 0 14px;
      font-weight: bold;
      color: #24513b;
    }

    .bars {
      display: grid;
      gap: 8px;
      position: relative;
      z-index: 2;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 72px 1fr 34px;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .bar-bg {
      height: 14px;
      background: rgba(255,255,255,0.65);
      border: 2px solid #3f7f5f;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: #48c774;
      transition: width 0.2s linear, background 0.2s linear;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 12px 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #ff8fc7;
      color: white;
      box-shadow: 0 4px 0 #d94f94;
      transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #d94f94;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .reset-button {
      grid-column: span 2;
      background: #5b8def;
      box-shadow: 0 4px 0 #3260bd;
    }

    .info {
      margin-top: 14px;
      font-size: 13px;
      color: #777;
      line-height: 1.4;
    }

    .floating-message {
      position: absolute;
      left: 50%;
      top: 92px;
      transform: translateX(-50%);
      background: white;
      color: #ff4fa3;
      border: 3px solid #ff8fc7;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .floating-message.show {
      animation: popMessage 1s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes sleepBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    @keyframes popMessage {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
      20% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -18px) scale(0.95); }
    }
  </style>
</head>
<body>
  <main class="game-wrapper">
    <h1 class="title">Tamagotchi</h1>

    <section class="screen">
      <div class="sky-decoration">
        <div class="cloud one"></div>
        <div class="cloud two"></div>
      </div>

      <div id="floatingMessage" class="floating-message">Yay!</div>

      <div class="pet-area">
        <div id="pet" class="pet">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>

      <p id="statusText" class="status-text">Your pet is happy!</p>

      <div class="bars">
        <div class="bar-row">
          <span>Hunger</span>
          <div class="bar-bg"><div id="hungerBar" class="bar-fill"></div></div>
          <span id="hungerValue">100</span>
        </div>
        <div class="bar-row">
          <span>Happy</span>
          <div class="bar-bg"><div id="happyBar" class="bar-fill"></div></div>
          <span id="happyValue">100</span>
        </div>
        <div class="bar-row">
          <span>Energy</span>
          <div class="bar-bg"><div id="energyBar" class="bar-fill"></div></div>
          <span id="energyValue">100</span>
        </div>
        <div class="bar-row">
          <span>Clean</span>
          <div class="bar-bg"><div id="cleanBar" class="bar-fill"></div></div>
          <span id="cleanValue">100</span>
        </div>
      </div>
    </section>

    <section class="buttons">
      <button id="feedButton">🍙 Feed</button>
      <button id="playButton">🎾 Play</button>
      <button id="sleepButton">💤 Sleep</button>
      <button id="cleanButton">🛁 Clean</button>
      <button id="resetButton" class="reset-button">🔄 Restart</button>
    </section>

    <p class="info">Keep your pet fed, happy, rested, and clean. If any stat reaches 0, your pet gives up!</p>
  </main>

  <script>
    const pet = document.getElementById("pet");
    const statusText = document.getElementById("statusText");
    const floatingMessage = document.getElementById("floatingMessage");

    const feedButton = document.getElementById("feedButton");
    const playButton = document.getElementById("playButton");
    const sleepButton = document.getElementById("sleepButton");
    const cleanButton = document.getElementById("cleanButton");
    const resetButton = document.getElementById("resetButton");

    const bars = {
      hunger: document.getElementById("hungerBar"),
      happy: document.getElementById("happyBar"),
      energy: document.getElementById("energyBar"),
      clean: document.getElementById("cleanBar")
    };

    const values = {
      hunger: document.getElementById("hungerValue"),
      happy: document.getElementById("happyValue"),
      energy: document.getElementById("energyValue"),
      clean: document.getElementById("cleanValue")
    };

    let stats;
    let isDead;
    let isSleeping;
    let gameTimer;

    function startGame() {
      stats = {
        hunger: 100,
        happy: 100,
        energy: 100,
        clean: 100
      };

      isDead = false;
      isSleeping = false;

      clearInterval(gameTimer);
      gameTimer = setInterval(gameTick, 1000);
      updateDisplay();
      showMessage("Hello!");
    }

    function clamp(value) {
      return Math.max(0, Math.min(100, value));
    }

    function changeStat(name, amount) {
      stats[name] = clamp(stats[name] + amount);
    }

    function gameTick() {
      if (isDead) return;

      if (isSleeping) {
        changeStat("energy", 8);
        changeStat("hunger", -3);
        changeStat("clean", -2);

        if (stats.energy >= 100) {
          isSleeping = false;
          showMessage("Awake!");
        }
      } else {
        changeStat("hunger", -4);
        changeStat("happy", -3);
        changeStat("energy", -2);
        changeStat("clean", -2);
      }

      if (stats.hunger <= 0 || stats.happy <= 0 || stats.energy <= 0 || stats.clean <= 0) {
        isDead = true;
        clearInterval(gameTimer);
      }

      updateDisplay();
    }

    function updateDisplay() {
      Object.keys(stats).forEach(name => {
        bars[name].style.width = stats[name] + "%";
        values[name].textContent = stats[name];

        if (stats[name] <= 25) {
          bars[name].style.background = "#ff5a5a";
        } else if (stats[name] <= 55) {
          bars[name].style.background = "#ffb84d";
        } else {
          bars[name].style.background = "#48c774";
        }
      });

      pet.className = "pet";

      if (isDead) {
        pet.classList.add("dead");
        statusText.textContent = "Oh no... your pet gave up. Restart?";
        setButtonsDisabled(true);
        return;
      }

      setButtonsDisabled(false);

      if (isSleeping) {
        pet.classList.add("sleeping");
        statusText.textContent = "Your pet is sleeping... Zzz";
        return;
      }

      const lowestStat = Math.min(stats.hunger, stats.happy, stats.energy, stats.clean);

      if (lowestStat <= 25) {
        pet.classList.add("sick");
        statusText.textContent = getWarningText();
      } else if (lowestStat <= 55) {
        statusText.textContent = "Your pet needs attention.";
      } else {
        statusText.textContent = "Your pet is happy!";
      }
    }

    function getWarningText() {
      if (stats.hunger <= 25) return "Your pet is starving!";
      if (stats.happy <= 25) return "Your pet feels lonely!";
      if (stats.energy <= 25) return "Your pet is exhausted!";
      if (stats.clean <= 25) return "Your pet is dirty!";
      return "Your pet needs help!";
    }

    function setButtonsDisabled(disabled) {
      feedButton.disabled = disabled;
      playButton.disabled = disabled;
      sleepButton.disabled = disabled;
      cleanButton.disabled = disabled;
    }

    function showMessage(text) {
      floatingMessage.textContent = text;
      floatingMessage.classList.remove("show");
      void floatingMessage.offsetWidth;
      floatingMessage.classList.add("show");
    }

    feedButton.addEventListener("click", () => {
      if (isDead || isSleeping) return;
      changeStat("hunger", 22);
      changeStat("clean", -4);
      showMessage("Yummy!");
      updateDisplay();
    });

    playButton.addEventListener("click", () => {
      if (isDead || isSleeping) return;
      changeStat("happy", 24);
      changeStat("energy", -12);
      changeStat("hunger", -7);
      showMessage("Fun!");
      updateDisplay();
    });

    sleepButton.addEventListener("click", () => {
      if (isDead) return;
      isSleeping = true;
      showMessage("Zzz...");
      updateDisplay();
    });

    cleanButton.addEventListener("click", () => {
      if (isDead || isSleeping) return;
      changeStat("clean", 28);
      changeStat("happy", 4);
      showMessage("Fresh!");
      updateDisplay();
    });

    resetButton.addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
