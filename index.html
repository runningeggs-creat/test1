<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Pet Tamagotchi</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: radial-gradient(circle at top, #ffeef8 0%, #c9f3ff 45%, #9bd7ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #263238;
      user-select: none;
    }

    .game-shell {
      width: min(430px, 94vw);
      background: linear-gradient(145deg, #ff8fd1, #ff5db8);
      border: 6px solid #ffffff;
      border-radius: 42px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25), inset 0 0 12px rgba(255, 255, 255, 0.45);
      position: relative;
    }

    .game-shell::before,
    .game-shell::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff8fb;
      border-radius: 50%;
      top: 18px;
      box-shadow: inset 0 2px 3px rgba(0,0,0,.12);
    }

    .game-shell::before { left: 28px; }
    .game-shell::after { right: 28px; }

    h1 {
      text-align: center;
      color: white;
      margin: 8px 0 14px;
      text-shadow: 0 3px 0 rgba(0,0,0,.15);
      letter-spacing: 1px;
      font-size: 1.8rem;
    }

    .screen {
      background: #eafff8;
      border: 6px solid #4b4b4b;
      border-radius: 24px;
      padding: 16px;
      min-height: 430px;
      box-shadow: inset 0 0 20px rgba(0,0,0,.12);
      position: relative;
      overflow: hidden;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: .9rem;
      font-weight: bold;
    }

    .name-input {
      border: 2px solid #5e5e5e;
      border-radius: 10px;
      padding: 6px 8px;
      width: 135px;
      font-weight: bold;
      background: #fff;
    }

    .message {
      height: 48px;
      background: #fff;
      border: 3px solid #444;
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
      box-shadow: 0 3px 0 rgba(0,0,0,.1);
    }

    .pet-area {
      height: 155px;
      background: linear-gradient(#b8f7ff 0 60%, #b4ee8a 60% 100%);
      border: 4px solid #444;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }

    .sun {
      position: absolute;
      top: 14px;
      right: 22px;
      width: 34px;
      height: 34px;
      background: #ffe266;
      border-radius: 50%;
      box-shadow: 0 0 0 8px rgba(255,226,102,.28);
    }

    .poop {
      position: absolute;
      left: 32px;
      bottom: 30px;
      font-size: 28px;
      display: none;
      animation: pop .25s ease;
    }

    .pet {
      width: 96px;
      height: 96px;
      background: #ffd166;
      border: 5px solid #333;
      border-radius: 42% 42% 48% 48%;
      position: relative;
      transform-origin: bottom center;
      animation: idle 1.1s infinite ease-in-out;
      box-shadow: inset -10px -10px 0 rgba(0,0,0,.08);
    }

    .pet.sick {
      background: #a8d8a2;
      animation: sickShake .25s infinite;
    }

    .pet.sleeping {
      background: #b8b8ff;
      animation: sleepBob 2s infinite ease-in-out;
    }

    .pet.dead {
      background: #bdbdbd;
      animation: none;
      transform: rotate(8deg);
    }

    .ear {
      position: absolute;
      width: 28px;
      height: 28px;
      background: inherit;
      border: 5px solid #333;
      top: -18px;
      z-index: -1;
    }

    .ear.left {
      left: 10px;
      border-radius: 70% 20% 50% 20%;
      transform: rotate(-25deg);
    }

    .ear.right {
      right: 10px;
      border-radius: 20% 70% 20% 50%;
      transform: rotate(25deg);
    }

    .eye {
      position: absolute;
      top: 34px;
      width: 12px;
      height: 16px;
      background: #222;
      border-radius: 50%;
    }

    .eye.left { left: 26px; }
    .eye.right { right: 26px; }

    .pet.sleeping .eye,
    .pet.dead .eye {
      height: 4px;
      top: 40px;
      border-radius: 4px;
    }

    .pet.dead .eye.left::after,
    .pet.dead .eye.right::after {
      content: "×";
      position: absolute;
      top: -15px;
      left: -2px;
      font-size: 18px;
      color: #222;
      background: transparent;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 58px;
      width: 24px;
      height: 12px;
      border-bottom: 4px solid #222;
      border-radius: 0 0 30px 30px;
      transform: translateX(-50%);
    }

    .pet.sick .mouth {
      border-bottom: 0;
      border-top: 4px solid #222;
      border-radius: 30px 30px 0 0;
    }

    .zzz {

      right: 95px;
      top: 35px;
      font-weight: bold;
      font-size: 24px;
      color: #384bff;
